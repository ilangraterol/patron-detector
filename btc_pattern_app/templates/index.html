<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Pattern Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container py-4">
        <header class="text-center border-bottom pb-3 mb-4">
            <h1 class="text-danger">BTC/USDT Pattern Detector</h1>
            <p class="text-muted">Detección automática de patrones chartistas</p>
            
            <div class="d-flex justify-content-center gap-3 mt-3 flex-wrap">
                <div class="card text-center py-2 px-3" style="min-width: 120px;">
                    <small class="text-muted">Precio Actual</small>
                    <strong id="currentPrice" class="fs-5">--</strong>
                </div>
                <div class="card text-center py-2 px-3" style="min-width: 120px;">
                    <small class="text-muted">Cambio 24h</small>
                    <strong id="priceChange" class="fs-5">--</strong>
                </div>
                <div class="card text-center py-2 px-3" style="min-width: 120px;">
                    <small class="text-muted">Volumen 24h</small>
                    <strong id="volume24h" class="fs-5">--</strong>
                </div>
            </div>
        </header>
        
        <div class="d-flex justify-content-center gap-2 mb-4 flex-wrap">
            <button class="btn btn-outline-primary" data-tf="1m">1m</button>
            <button class="btn btn-outline-primary" data-tf="5m">5m</button>
            <button class="btn btn-outline-primary" data-tf="15m">15m</button>
            <button class="btn btn-outline-primary" data-tf="30m">30m</button>
            <button class="btn btn-primary active" data-tf="1h">1H</button>
            <button class="btn btn-outline-primary" data-tf="4h">4H</button>
            <button class="btn btn-outline-primary" data-tf="1d">1D</button>
        </div>
        
        <div class="alert alert-danger" id="errorMessage" style="display: none;"></div>
        
        <div class="card mb-4">
            <div id="chart" style="height: 600px;">
                <div class="d-flex align-items-center justify-content-center h-100 text-muted">
                    <div>Cargando gráfico...</div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Análisis de Patrones</h5>
            </div>
            <div class="card-body" id="analysisContent">
                <div class="text-center text-muted py-4">Analizando patrones...</div>
            </div>
        </div>
    </div>

    <script>
        let currentTimeframe = '1h';
        let updateInterval = null;
        const UPDATE_TIME = 10000;
        
        const directionIcons = {
            'bullish': '📈',
            'bearish': '📉',
            'neutral': '➡️'
        };
        
        function init() {
            document.querySelectorAll('[data-tf]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('[data-tf]').forEach(b => b.classList.remove('active', 'btn-primary'));
                    document.querySelectorAll('[data-tf]').forEach(b => b.classList.add('btn-outline-primary'));
                    btn.classList.add('active', 'btn-primary');
                    btn.classList.remove('btn-outline-primary');
                    currentTimeframe = btn.dataset.tf;
                    loadData();
                });
            });
            
            loadData();
            updateInterval = setInterval(loadData, UPDATE_TIME);
        }
        
        async function loadData() {
            try {
                showError(null);
                
                const response = await fetch(`/api/data?timeframe=${currentTimeframe}`);
                const data = await response.json();
                
                if (data.error) {
                    showError(data.error);
                    return;
                }
                
                updatePriceDisplay(data.ticker);
                renderChart(data.chart);
                renderAnalysis(data.analysis);
                
            } catch (error) {
                showError('Error al cargar datos: ' + error.message);
            }
        }
        
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            if (message) {
                errorEl.textContent = message;
                errorEl.style.display = 'block';
            } else {
                errorEl.style.display = 'none';
            }
        }
        
        function updatePriceDisplay(ticker) {
            const currentPriceEl = document.getElementById('currentPrice');
            const priceChangeEl = document.getElementById('priceChange');
            const volumeEl = document.getElementById('volume24h');
            
            if (ticker) {
                currentPriceEl.textContent = '$' + ticker.price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                
                const changePercent = ticker.change || 0;
                const changeClass = changePercent >= 0 ? 'text-success' : 'text-danger';
                const changeSign = changePercent >= 0 ? '+' : '';
                
                priceChangeEl.textContent = changeSign + changePercent.toFixed(2) + '%';
                priceChangeEl.className = 'fs-5 ' + changeClass;
                
                volumeEl.textContent = '$' + (ticker.volume / 1000000).toFixed(2) + 'M';
            }
        }
        
        function renderChart(chartData) {
            const chartDiv = document.getElementById('chart');
            
            if (!chartData || !chartData.data) {
                chartDiv.innerHTML = '<div class="d-flex align-items-center justify-content-center h-100 text-muted">Sin datos disponibles</div>';
                return;
            }
            
            const trace = {
                x: chartData.data.timestamps,
                open: chartData.data.open,
                high: chartData.data.high,
                low: chartData.data.low,
                close: chartData.data.close,
                type: 'candlestick',
                increasing: {line: {color: '#26a69a'}},
                decreasing: {line: {color: '#ef5350'}},
                name: 'BTC/USDT'
            };
            
            const shapes = chartData.shapes || [];
            const annotations = chartData.annotations || [];
            
            const layout = {
                title: {
                    text: 'BTC/USDT - Gráfico en Tiempo Real',
                    font: {size: 20, color: '#e0e0e0'}
                },
                template: 'plotly_dark',
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                xaxis: {
                    title: 'Tiempo',
                    gridcolor: '#1a1a2e',
                    zerolinecolor: '#1a1a2e'
                },
                yaxis: {
                    title: 'Precio (USDT)',
                    gridcolor: '#1a1a2e',
                    zerolinecolor: '#1a1a2e'
                },
                height: 600,
                margin: {l: 60, r: 60, t: 80, b: 60},
                shapes: shapes,
                annotations: annotations
            };
            
            Plotly.newPlot('chart', [trace], layout, {responsive: true});
        }
        
        function renderAnalysis(analysis) {
            const contentEl = document.getElementById('analysisContent');
            
            if (!analysis || analysis.patterns_found === 0) {
                contentEl.innerHTML = '<div class="text-center text-muted py-4">No se detectaron patrones</div>';
                return;
            }
            
            let html = '<ul class="list-group mb-3">';
            
            analysis.patterns_detail.forEach(pattern => {
                const icon = directionIcons[pattern.direction] || '➡️';
                const borderClass = pattern.direction === 'bullish' ? 'border-success' : pattern.direction === 'bearish' ? 'border-danger' : 'border-secondary';
                const badgeClass = pattern.direction === 'bullish' ? 'bg-success' : pattern.direction === 'bearish' ? 'bg-danger' : 'bg-secondary';
                const confidenceClass = pattern.confidence === 'high' ? 'bg-success' : pattern.confidence === 'medium' ? 'bg-warning text-dark' : 'bg-secondary';
                const patternName = pattern.name || pattern.type;
                
                const directionText = pattern.direction === 'bullish' ? 'BULLISH (Alcista)' : pattern.direction === 'bearish' ? 'BEARISH (Bajista)' : 'NEUTRAL (Neutral)';
                const confidenceText = pattern.confidence === 'high' ? 'HIGH (Alta)' : pattern.confidence === 'medium' ? 'MEDIUM (Media)' : 'LOW (Baja)';
                const directionHelp = pattern.direction === 'bullish' ? 'El patrón indica una tendencia alcista - el precio podría subir' : pattern.direction === 'bearish' ? 'El patrón indica una tendencia bajista - el precio podría bajar' : 'El patrón no tiene dirección clara';
                const confidenceHelp = pattern.confidence === 'high' ? 'Alta confianza - el patrón es más fiable' : pattern.confidence === 'medium' ? 'Confianza media - el patrón es moderadamente fiable' : 'Baja confianza - el patrón puede ser menos fiable';
                
                html += `
                    <li class="list-group-item ${borderClass}">
                        <div class="d-flex justify-content-between align-items-start flex-wrap">
                            <div>
                                <strong class="pattern-name" 
                                        data-bs-toggle="tooltip" 
                                        data-bs-title="${pattern.help || ''}"
                                        style="cursor: pointer;">${icon} ${patternName}</strong>
                                <div class="text-muted small">${pattern.description}</div>
                            </div>
                            <div class="text-end">
                                <span class="badge ${badgeClass}" 
                                      data-bs-toggle="tooltip" 
                                      data-bs-title="${directionHelp}">${directionText}</span>
                                <span class="badge ${confidenceClass} ms-1" 
                                      data-bs-toggle="tooltip" 
                                      data-bs-title="${confidenceHelp}">${confidenceText}</span>
                            </div>
                        </div>
                    </li>
                `;
            });
            
            html += '</ul>';
            
            const dirIcon = directionIcons[analysis.direction] || '➡️';
            const recBgClass = analysis.direction === 'bullish' ? 'success' : analysis.direction === 'bearish' ? 'danger' : 'secondary';
            html += `
                <div class="alert alert-${recBgClass} text-center">
                    <strong>${dirIcon} ${analysis.recommendation}</strong>
                </div>
            `;
            
            contentEl.innerHTML = html;
            
            // Initialize Bootstrap tooltips
            const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
            tooltipTriggerList.forEach(tooltipTriggerEl => {
                new bootstrap.Tooltip(tooltipTriggerEl);
            });
        }
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
